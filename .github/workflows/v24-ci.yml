name: V2.4 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/v24-production-readiness]
permissions:
  contents: read
concurrency:
  group: v24-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: https://build.invalid
      SUPABASE_PUBLISHABLE_KEY: build-placeholder
      APP_URL: https://build.invalid
      AUTH_FLOW_SECRET: build-placeholder-auth-flow-secret-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit -- --maxWorkers=2
      - run: npm run build
      - name: Verify actual Docker build context and authoritative commercial contract
        run: docker build --target build --tag ai-diagnostic-web-build:ci .
      - name: Verify controlled entry points are present and Node-loadable without network
        run: >-
          docker run --rm --network none --entrypoint node ai-diagnostic-web-build:ci
          --import tsx -e
          "const f=require('node:fs');for(const p of ['scripts/controlled-team-worker.ts','scripts/controlled-team-w2-access.ts','scripts/controlled-team-evidence-readonly.ts'])if(!f.lstatSync(p).isFile())throw Error('controlled_entrypoint_missing');if(f.existsSync('scripts/test-v27-team-w2-local.py')||f.existsSync('scripts/operator-w2/operator.ts'))throw Error('operator_test_or_transport_in_runtime');Promise.all([import('./src/server/team/controlled-runner.ts'),import('./src/server-runtime/team-w2-access.ts'),import('./scripts/controlled-team-evidence-readonly.ts')]).catch(()=>process.exit(1));"
  sql:
    name: isolated-sql
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci
      - name: Run isolated PostgreSQL security and regression suites
        run: python3 scripts/test-v24-ci.py
